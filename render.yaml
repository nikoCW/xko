services:
  - type: web
    name: okx-live-trader-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server_with_nautilus:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /bridge-health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OKX_API_BASE
        value: https://www.okx.com
      - key: XKO_NAUTILUS_URL
        fromService:
          type: pserv
          name: xko-nautilus-bridge
          property: hostport
      - key: BRIDGE_API_TOKEN
        fromService:
          type: pserv
          name: xko-nautilus-bridge
          envVarKey: BRIDGE_API_TOKEN

  - type: pserv
    name: xko-nautilus-bridge
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r nautilus_bridge/requirements.txt
    startCommand: cd nautilus_bridge && python -m nautilus_service.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NAUTILUS_BRIDGE_HOST
        value: 0.0.0.0
      - key: OKX_DEMO
        value: "true"
      - key: OKX_ACCOUNT_ID
        value: OKX-001
      - key: OKX_MARGIN_MODE
        value: CROSS
      - key: OKX_INSTRUMENT_TYPE
        value: SWAP
      - key: INTENT_DB_PATH
        value: /var/data/xko-nautilus/intents.db
      - key: ALLOWED_INSTRUMENTS
        value: BTC-USDT-SWAP.OKX,ETH-USDT-SWAP.OKX,SOL-USDT-SWAP.OKX
      - key: EQUITY_CURRENCY
        value: USDT
      - key: MAX_RISK_PCT
        value: "0.50"
      - key: MAX_ORDER_QTY
        value: "10"
      - key: MAX_NOTIONAL_PER_ORDER_USDT
        value: "5000"
      - key: ALLOW_ORDER_SUBMIT
        value: "false"
      - key: ALLOW_UNPROTECTED_ENTRY
        value: "false"
      - key: ALLOW_MARKET_ENTRY
        value: "false"
      - key: MAX_ORDER_SUBMIT_RATE
        value: 5/00:00:01
      - key: MAX_ORDER_MODIFY_RATE
        value: 10/00:00:01
      - key: PREVIEW_TIMEOUT_SECS
        value: "5"
      - key: BRIDGE_API_TOKEN
        generateValue: true
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
    disk:
      name: xko-nautilus-intents
      mountPath: /var/data/xko-nautilus
      sizeGB: 1
