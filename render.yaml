services:
  - type: web
    name: okx-live-trader-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: trader-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OKX_API_BASE
        value: https://www.okx.com
      - key: OKX_MODE
        value: demo
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: STATE_DB
        value: /var/data/trader.sqlite3
      - key: MONITOR_ENABLED
        value: "true"
      - key: MONITOR_INTERVAL_SECONDS
        value: "60"
